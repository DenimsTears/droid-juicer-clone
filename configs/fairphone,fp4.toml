[juicer]
dynpart = "super"
firmware = [
    { partition = "vendor", origin = "firmware", destination = "qcom", files = [
            { name = "a619_gmu.bin" },
            { name = "a630_sqe.fw" },
        ] },
    { partition = "vendor", origin = "firmware", destination = "qcom/sm7225/fairphone4", files = [
            { name = "a615_zap.mdt" },
            { name = "lagoon_ipa_fws.mdt", rename = "ipa_fws.mdt" },
        ] },
    { partition = "vendor", origin = "firmware", destination = ".", files = [
            { name = "aw882xx_monitor.bin" },
            { name = "aw882xx_spk_reg_l.bin" },
            { name = "aw882xx_spk_reg_r.bin" },
        ] },
    { partition = "modem", origin = "image", destination = "qcom/sm7225/fairphone4", files = [
            { name = "adsp.mdt" },
            { name = "adspr.jsn" },
            { name = "adsps.jsn" },
            { name = "adspua.jsn" },
            { name = "cdsp.mdt" },
            { name = "cdspr.jsn" },
            { name = "modem.mdt" },
            { name = "modemr.jsn" },
            { name = "modemuw.jsn" },
            { name = "venus.mdt" },
            { name = "wlanmdsp.mbn" },
        ] },
    { partition = "bluetooth", origin = "image", destination = "qca", files = [
            { name = "apnv11.bin" },
            { name = "apbtfw11.tlv" },
        ] },
    { partition = "vendor", origin = "etc/sensors", destination = "/var/lib/droid-juicer/sensors/sensors", files = [
            { name = "sns_reg_config", rename = "sns_reg.conf" },
        ] },
]
folders = [
    { partition = "vendor", destination = "/var/lib/droid-juicer/sensors", folders = [
        { name = "dsp" },
        { name = "etc/acdbdata", rename = "acdb" },
        { name = "etc/sensors" },
    ] },
    { partition = "persist", destination = "/var/lib/droid-juicer/sensors", folders = [
        { name = "sensors" },
    ] },
]
